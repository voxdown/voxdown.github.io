<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>VoxDown</title>
<meta name="description" content="Markdown for stories read aloud.">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script>
  // The playground lives in the voxdown repository's site, under /voxdown/.
  // Keep the rest of the address, so voxdown.github.io/spec.html still arrives.
  var rest = location.pathname === "/" ? "/" : location.pathname;
  location.replace("/voxdown" + rest + location.search + location.hash);
</script>
<noscript><meta http-equiv="refresh" content="0; url=/voxdown/"></noscript>
</head>
<body>
<p>The VoxDown playground is at <a href="/voxdown/">voxdown.github.io/voxdown</a>.</p>
</body>
</html>
